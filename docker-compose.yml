name: colcom

services:
  db:
    image: postgres:18-alpine
    environment: &env
      POSTGRES_DB: colcom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      PGPORT: 5434
      TZ: America/Recife
    # With host networking Postgres would otherwise listen on every public interface
    command: ["postgres", "-c", "listen_addresses=localhost"]
    network_mode: host
    volumes:
      # Since Postgres 18 the image keeps its data in a versioned folder under this path
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      # The validation schemas shared with the frontend (installed as file:../shared)
      additional_contexts:
        shared: ./shared
      args:
        TZ: America/Recife
    environment:
      <<: *env
      PORT: 3000
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env (see .env.example)}
      DB_PATH: /app/gitDB
      NODE_ENV: production
      # Optional; see .env.example
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      RATE_LIMIT_LOGIN: ${RATE_LIMIT_LOGIN:-}
      RATE_LIMIT_SIGN_UP: ${RATE_LIMIT_SIGN_UP:-}
      RATE_LIMIT_CONTENTS: ${RATE_LIMIT_CONTENTS:-}
      RATE_LIMIT_INTERACTIONS: ${RATE_LIMIT_INTERACTIONS:-}
    depends_on:
      - db
    network_mode: host
    restart: always
    volumes:
      - git_data:/app/gitDB

  frontend_nginx:
    build:
      context: ./frontend
      additional_contexts:
        shared: ./shared
      args:
        # Relative, so the build works on any host: nginx proxies /api/ on the same origin.
        # An address on another origin also needs it in the CSP's connect-src (nginx/headers.conf)
        VITE_API_ADDRESS: ${VITE_API_ADDRESS:-/api}
    environment:
      TZ: America/Recife
      # Optional; with it nginx serves HTTPS once certbot has the certificate (see .env.example)
      DOMAIN: ${DOMAIN:-}
    volumes:
      # 40-select-config.sh writes /etc/nginx/nginx.conf from one of these, depending on DOMAIN
      - ./nginx/nginx-http.conf:/etc/nginx/colcom/nginx-http.conf:ro
      - ./nginx/nginx-https.conf:/etc/nginx/colcom/nginx-https.conf:ro
      - ./nginx/40-select-config.sh:/docker-entrypoint.d/40-select-config.sh:ro
      - ./nginx/headers.conf:/etc/nginx/headers.conf:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - backend
    network_mode: host
    restart: always

  # Gets and renews the certificate for DOMAIN; exits right away when DOMAIN is unset
  certbot:
    image: certbot/certbot:v5.7.0
    entrypoint: ["/bin/sh", "/colcom/certbot.sh"]
    environment:
      DOMAIN: ${DOMAIN:-}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-}
    volumes:
      - ./nginx/certbot.sh:/colcom/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - frontend_nginx
    # Forwards docker stop to the script, which spends most of its time in sleep
    init: true
    # Not "always": without a domain the script exits successfully and should stay stopped
    restart: on-failure

volumes:
  postgres_data:
  git_data:
  letsencrypt:
  certbot_www: