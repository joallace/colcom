name: colcom

services:
  db:
    image: postgres:18-alpine
    environment: &env
      POSTGRES_DB: colcom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      PGPORT: 5434
      TZ: America/Recife
    # With host networking Postgres would otherwise listen on every public interface
    command: ["postgres", "-c", "listen_addresses=localhost"]
    network_mode: host
    volumes:
      # Since Postgres 18 the image keeps its data in a versioned folder under this path
      - postgres_data:/var/lib/postgresql

  backend:
    build:
      context: ./backend
      # The validation schemas shared with the frontend (installed as file:../shared)
      additional_contexts:
        shared: ./shared
      args:
        TZ: America/Recife
    environment:
      <<: *env
      PORT: 3000
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?Set ACCESS_TOKEN_SECRET in .env (see .env.example)}
      DB_PATH: /app/gitDB
      NODE_ENV: production
    depends_on:
      - db
    network_mode: host
    restart: always
    volumes:
      - git_data:/app/gitDB

  frontend_nginx:
    build:
      context: ./frontend
      additional_contexts:
        shared: ./shared
      args:
        # Relative, so the build works on any host: nginx proxies /api/ on the same origin.
        # An address on another origin also needs it in the CSP's connect-src (nginx/headers.conf)
        VITE_API_ADDRESS: ${VITE_API_ADDRESS:-/api}
    environment:
      TZ: America/Recife
    volumes:
      # - ./nginx/nginx-https.conf:/etc/nginx/nginx.conf:ro    # Uncomment for using https instead of http
      - ./nginx/nginx-http.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/headers.conf:/etc/nginx/headers.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - backend
    network_mode: host
    restart: always

volumes:
  postgres_data:
  git_data: