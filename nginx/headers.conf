# Security headers, included by both nginx-http.conf and nginx-https.conf at server level.
# nginx drops every inherited add_header in a block that has an add_header of its own, so a
# location that adds a header must include this file again.

# The JWT is in localStorage, so the CSP is the backstop if user HTML ever slips past DOMPurify:
# only the bundle's own scripts run, never inline ones. 'unsafe-eval' is there because Ajv compiles
# the shared schemas into functions at runtime (new Function); precompiling them would drop it.
# Inline styles are needed by index.html's loading screen and the style attributes TipTap and
# Recharts write; avatars are base64 PNGs (data:).
# A VITE_API_ADDRESS on another origin must be added to connect-src.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Older browsers ignore frame-ancestors
add_header X-Frame-Options "DENY" always;
